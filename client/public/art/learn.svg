<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Yoshlar moliyaviy savodxonlikni o'rganmoqda: hisob-kitob, grafiklar, algoritmlar va biznes">
<style>
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes pop{0%,15%{opacity:0;transform:scale(.6)}30%,100%{opacity:1;transform:scale(1)}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
.b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}.b5{animation-delay:.6s}
.ln{stroke-dasharray:420;animation:draw 2s .5s ease-out both}
.fl{animation:bob 4.5s ease-in-out infinite}.fl2{animation:bob 5.5s .8s ease-in-out infinite}.fl3{animation:bob 6s 1.6s ease-in-out infinite}
.gl{animation:glow 2.4s ease-in-out infinite}
.pp{transform-box:fill-box;transform-origin:center;animation:pop 6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.bar,.ln,.fl,.fl2,.fl3,.gl,.pp{animation:none!important}}
</style>
<defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFF5E3"/><stop offset="1" stop-color="#E8FAF1"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11835A"/><stop offset="1" stop-color="#0A5C3B"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#08263E" flood-opacity=".16"/></filter>
</defs>

# Prometheus ogohlantirish qoidalari (SPEC §11). Chegaralar boshlang'ich — haqiqiy yuk ma'lum bo'lgach sozlanadi.
groups:
  - name: tajriba24
    rules:
      - alert: Tajriba24Down
        expr: up{job="tajriba24"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "Tajriba 24 server javob bermayapti", runbook: "docs/ops/RUNBOOK.md#server-ishlamayapti" }
      - alert: Tajriba24NotReady
        expr: probe_success{job="tajriba24-ready"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "/ready 503: saqlagich (PostgreSQL) javob bermayapti", runbook: "docs/ops/RUNBOOK.md#postgresql" }
      - alert: Tajriba24HighServerErrors
        expr: sum(rate(tajriba24_http_requests_total{status="5xx"}[5m])) / sum(rate(tajriba24_http_requests_total[5m])) > 0.02
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "HTTP 5xx ulushi 2 % dan yuqori" }
      - alert: Tajriba24InternalWsErrors
        expr: increase(tajriba24_ws_errors_total[10m]) > 5
        labels: { severity: ticket }
        annotations: { summary: "WebSocket ichki xatolar ko'payib ketdi", runbook: "docs/ops/RUNBOOK.md#ichki-xatolar" }
      - alert: Tajriba24SlowActions
        expr: histogram_quantile(0.99, sum(rate(tajriba24_action_seconds_bucket[5m])) by (le)) > 0.1
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Harakatni hisoblash p99 > 100 ms (dvigatel yoki CPU muammosi)" }
      - alert: Tajriba24RateLimitSpike
        expr: sum(rate(tajriba24_rate_limited_total[5m])) > 5
        for: 10m
        labels: { severity: info }
        annotations: { summary: "Tezlik cheklovi ko'p ishlayapti (suiiste'mol yoki noto'g'ri mijoz?)" }
      - alert: Tajriba24MemoryHigh
        expr: tajriba24_process_resident_bytes > 1.5e9
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "Jarayon xotirasi 1.5 GB dan oshdi (xona/taymer oqishi?)" }
      - alert: Tajriba24NoGamesFinished
        expr: increase(tajriba24_games_total{event="started"}[6h]) > 5 and increase(tajriba24_games_total{event="finished"}[6h]) == 0
        labels: { severity: info }
        annotations: { summary: "O'yinlar boshlanmoqda, lekin hech biri tugamayapti (6 soat)" }

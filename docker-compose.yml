# Mahalliy ishlab chiqish: PostgreSQL (server va testlar uchun)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: poyga, POSTGRES_PASSWORD: poyga, POSTGRES_DB: poyga }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U poyga"], interval: 5s, retries: 10 }
volumes: { pgdata: {} }

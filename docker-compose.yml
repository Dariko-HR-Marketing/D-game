# Mahalliy ishlab chiqish: PostgreSQL (server va testlar uchun)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: tajriba24, POSTGRES_PASSWORD: tajriba24, POSTGRES_DB: tajriba24 }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tajriba24"], interval: 5s, retries: 10 }
volumes: { pgdata: {} }

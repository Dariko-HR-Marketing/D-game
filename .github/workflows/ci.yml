name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: poyga, POSTGRES_PASSWORD: poyga, POSTGRES_DB: poyga_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poyga" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://poyga:poyga@localhost:5432/poyga_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
  docker:
    # Dockerfile'ni haqiqatan quradi va konteyner /ready ga javob berishini tekshiradi (sandboxda Docker daemon yo'q edi).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t poyga-server .
      - run: |
          # production rejimi haqiqiy autentifikatsiyasiz ataylab ishga tushmaydi (server/src/app.ts), shuning uchun smoke-test staging'da
          docker run -d --name poyga -p 3000:3000 -e NODE_ENV=staging poyga-server
          for i in $(seq 1 30); do curl -sf localhost:3000/ready && exit 0; sleep 1; done
          docker logs poyga; exit 1
      - name: Veb image (mijoz + admin + Caddy) va Caddyfile tekshiruvi
        run: |
          docker build -f deploy/vps/Dockerfile.web --build-arg API_WS=wss://api.example.uz --build-arg API_HTTP=https://api.example.uz -t poyga-web .
          docker run --rm -e API_DOMAIN=api.example.uz -e APP_DOMAIN=game.example.uz -e ADMIN_DOMAIN=admin.example.uz poyga-web caddy validate --config /etc/caddy/Caddyfile
          docker run --rm poyga-web sh -c 'test -f /srv/app/index.html && test -f /srv/admin/index.html'
  ui:
    # Brauzerda: veb eksport → axe-core (WCAG 2.2 AA) barcha ekranlarda va kirish/admin ekranlarida → bot bilan 60 navbat o'ynash (xatosiz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx playwright-core install --with-deps chromium
      - run: pnpm --filter @poyga/client export:web
      - run: pnpm --filter @poyga/admin build
      - name: Statik serverlar
        run: |
          (cd client/dist && python3 -m http.server 8081 >/dev/null 2>&1 &)
          (cd admin/dist && python3 -m http.server 8082 >/dev/null 2>&1 &)
          sleep 2
      - run: pnpm --filter @poyga/server a11y
      - run: pnpm --filter @poyga/server exec tsx scripts/screens-login.ts
      - run: pnpm --filter @poyga/server exec tsx scripts/screens-admin.ts
      - run: pnpm --filter @poyga/server exec tsx scripts/e2e-play.ts
      - run: pnpm --filter @poyga/server exec tsx scripts/identity-check.ts
      - run: pnpm --filter @poyga/server exec tsx scripts/portfolio-check.ts
      - run: pnpm --filter @poyga/server exec tsx scripts/calc-check.ts
      - run: pnpm --filter @poyga/server exec tsx scripts/history-check.ts
      - run: pnpm --filter @poyga/server exec tsx scripts/resume-check.ts
      - run: pnpm --filter @poyga/server exec tsx scripts/sheet-check.ts
      - run: pnpm --filter @poyga/server exec tsx scripts/seats-check.ts
      - run: pnpm --filter @poyga/server exec tsx scripts/dock-check.ts

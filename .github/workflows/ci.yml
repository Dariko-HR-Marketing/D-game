name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: poyga, POSTGRES_PASSWORD: poyga, POSTGRES_DB: poyga_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poyga" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://poyga:poyga@localhost:5432/poyga_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
  docker:
    # Dockerfile'ni haqiqatan quradi va konteyner /ready ga javob berishini tekshiradi (sandboxda Docker daemon yo'q edi).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t poyga-server .
      - run: |
          docker run -d --name poyga -p 3000:3000 poyga-server
          for i in $(seq 1 30); do curl -sf localhost:3000/ready && exit 0; sleep 1; done
          docker logs poyga; exit 1

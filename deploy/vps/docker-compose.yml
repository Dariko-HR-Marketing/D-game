# Bitta VPS'da hammasi: PostgreSQL + Tajriba 24 server + veb mijoz + admin panel + Caddy (HTTPS).
# Ishlatish: deploy/vps/ papkasida `cp .env.example .env`, qiymatlarni to'ldiring, so'ng `docker compose up -d --build`.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER kerak (.env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: ${DB_NAME:?DB_NAME kerak (.env)}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"], interval: 5s, retries: 10 }
    # Port tashqariga ochilmaydi: faqat server ichki tarmoqdan ulanadi.

  server:
    build: { context: ../.., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      DATABASE_URL: postgres://${DB_USER}:${POSTGRES_PASSWORD}@db:5432/${DB_NAME}
      CORS_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN kerak},https://${ADMIN_DOMAIN:?ADMIN_DOMAIN kerak}
      PUBLIC_URL: https://${API_DOMAIN}   # ota-ona SMS havolalari (/parent/...) shu manzilda ochiladi
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      ADMIN_TOKENS: ${ADMIN_TOKENS:-}
      ADMIN_BOOTSTRAP_LOGIN: ${ADMIN_BOOTSTRAP_LOGIN:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_REQUIRE_2FA: ${ADMIN_REQUIRE_2FA:-1}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Kirish (SMS). AUTH_SECRET bo'lsa haqiqiy rejim; SMS_HTTP_URL — SMS shlyuz manzili (POST {to,text}, Bearer SMS_HTTP_TOKEN)
      AUTH_SECRET: ${AUTH_SECRET:-}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_FIXED_CODE: ${SMS_FIXED_CODE:-}   # faqat sinov (SMS_PROVIDER=fixed): doimiy 6 xonali kod
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      TURN_URLS: ${TURN_URLS:-}       # TURN (coturn) manzillari: turn:host:3478?transport=udp,turns:host:5349 — vaqtinchalik hisob (REST/HMAC) bilan
      TURN_SECRET: ${TURN_SECRET:-}   # coturn bilan umumiy sir (kamida 16 belgi); mijozga hech qachon berilmaydi
      ICE_SERVERS: ${ICE_SERVERS:-}   # ovozli aloqa: STUN/TURN (JSON). Bo'sh bo'lsa ommaviy STUN; barqaror aloqa uchun TURN kerak (docs/DEPLOY.md)
      LOG_LEVEL: info
      PORT: "3000"
      TRUST_PROXY: "1" # Caddy ortida: haqiqiy mijoz IP (tezlik cheklovi uchun)
    # Tashqariga to'g'ridan-to'g'ri ochilmaydi — faqat Caddy orqali.

  web:
    # Caddy + statik mijoz va admin (server manzili build vaqtida kiradi)
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.web
      args:
        API_WS: wss://${API_DOMAIN:?API_DOMAIN kerak}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        API_HTTP: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on: [server]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes: ["caddy_data:/data", "caddy_config:/config", "./cards:/srv/cards:ro"]


  # TURN (ovozli aloqa, NAT orqasidagilar uchun). Faqat yoqilganda ishga tushadi: `docker compose --profile turn up -d turn` (TURN_SECRET, TURN_REALM, TURN_EXTERNAL_IP kerak).
  # host tarmog'i: UDP relay oralig'i keng bo'ladi; xavfsizlik devorida oching: 3478/udp+tcp, 5349/tcp (TLS), TURN_MIN_PORT–TURN_MAX_PORT/udp.
  turn:
    image: coturn/coturn:4.6.2
    profiles: ["turn"]
    network_mode: host
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-}"
      - "--realm=${TURN_REALM:-}"
      - "--external-ip=${TURN_EXTERNAL_IP:-}"
      - "--listening-port=3478"
      - "--min-port=${TURN_MIN_PORT:-49152}"
      - "--max-port=${TURN_MAX_PORT:-49452}"
      - "--fingerprint"
      - "--no-cli"
      - "--no-multicast-peers"
      # ichki tarmoqqa (serverning o'ziga, db ga, bulut metadata ga) relay qilishni taqiqlaydi
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--total-quota=100"
      - "--user-quota=12"

volumes: { pgdata: {}, caddy_data: {}, caddy_config: {} }

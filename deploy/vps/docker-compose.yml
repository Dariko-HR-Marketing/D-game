# Bitta VPS'da hammasi: PostgreSQL + POYGA server + veb mijoz + admin panel + Caddy (HTTPS).
# Ishlatish: deploy/vps/ papkasida `cp .env.example .env`, qiymatlarni to'ldiring, so'ng `docker compose up -d --build`.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: poyga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: poyga
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U poyga"], interval: 5s, retries: 10 }
    # Port tashqariga ochilmaydi: faqat server ichki tarmoqdan ulanadi.

  server:
    build: { context: ../.., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      DATABASE_URL: postgres://poyga:${POSTGRES_PASSWORD}@db:5432/poyga
      CORS_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN kerak},https://${ADMIN_DOMAIN:?ADMIN_DOMAIN kerak}
      ADMIN_TOKENS: ${ADMIN_TOKENS:?ADMIN_TOKENS kerak}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Kirish (SMS). AUTH_SECRET bo'lsa haqiqiy rejim; SMS_HTTP_URL — SMS shlyuz manzili (POST {to,text}, Bearer SMS_HTTP_TOKEN)
      AUTH_SECRET: ${AUTH_SECRET:-}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      LOG_LEVEL: info
      PORT: "3000"
      TRUST_PROXY: "1" # Caddy ortida: haqiqiy mijoz IP (tezlik cheklovi uchun)
    # Tashqariga to'g'ridan-to'g'ri ochilmaydi — faqat Caddy orqali.

  web:
    # Caddy + statik mijoz va admin (server manzili build vaqtida kiradi)
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.web
      args:
        API_WS: wss://${API_DOMAIN:?API_DOMAIN kerak}
        API_HTTP: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on: [server]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes: ["caddy_data:/data", "caddy_config:/config", "./cards:/srv/cards:ro"]

volumes: { pgdata: {}, caddy_data: {}, caddy_config: {} }
